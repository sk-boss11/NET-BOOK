<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NET BOOK - Verify Account</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f0f2f5;font-family:Arial,sans-serif;padding:20px}
.card{width:100%;max-width:420px;background:white;padding:28px;border-radius:16px;box-shadow:0 5px 25px #0001}
h2{text-align:center;color:#1877f2}
p{text-align:center;color:#606770}
input,button{width:100%;padding:14px;margin-top:12px;border-radius:9px;font-size:16px}
input{border:1px solid #ccd0d5;text-align:center;letter-spacing:5px}
button{border:0;background:#1877f2;color:white;font-weight:bold}
.message{padding:10px;background:#fff3cd;border-radius:8px;margin:10px 0}
</style>
</head>
<body>
<div class="card">
<h2>NET BOOK</h2>
<p>আপনার Email অথবা Phone-এ পাঠানো ৬ সংখ্যার OTP লিখুন।</p>
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<div class="message">{{ message }}</div>
{% endfor %}
{% endwith %}
<form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<input type="text" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="৬ সংখ্যার OTP" required>
<button type="submit">Verify Account</button>
</form>
<form method="POST" action="{{ url_for('resend_otp') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<button type="submit" style="background:#606770">নতুন OTP পাঠান</button>
</form>

</div>
</body>
</html>
