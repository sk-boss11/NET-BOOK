<!DOCTYPE html>
<html lang="{{ current_language }}" dir="{{ language_dir }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NET BOOK - Forgot Password</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f0f2f5;font-family:Arial,sans-serif;padding:20px}
.card{width:100%;max-width:430px;background:white;padding:28px;border-radius:16px;box-shadow:0 5px 25px #0001}
h2{text-align:center;color:#1877f2}
p{text-align:center;color:#606770}
input,button{width:100%;padding:14px;margin-top:12px;border-radius:9px;font-size:16px}
input{border:1px solid #ddd}
button{border:0;background:#1877f2;color:white;font-weight:bold;cursor:pointer}
a{color:#1877f2;text-decoration:none}
.message{padding:10px;background:#e7f3ff;border-radius:8px;margin:10px 0}
.bottom{text-align:center;margin-top:20px}
</style>
</head>
<body>
<div class="card">
<h2>NET BOOK</h2>
<p>আপনার Email, Phone অথবা Username লিখুন।</p>
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<div class="message">{{ message }}</div>
{% endfor %}
{% endwith %}
<form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<input name="identity" placeholder="Email / Phone / Username" required autocomplete="username">
<button type="submit">Send OTP</button>
</form>
<div class="bottom"><a href="{{ url_for('login') }}">Login-এ ফিরে যান</a></div>
</div>
</body>
</html>
