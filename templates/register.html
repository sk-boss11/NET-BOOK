<!DOCTYPE html>
<html lang="{{ current_language }}" dir="{{ language_dir }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NET BOOK — {{ t('register_title') }}</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f0f2f5;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{background:white;width:100%;max-width:450px;padding:28px;border-radius:16px;box-shadow:0 4px 20px #0001}
h1{text-align:center;color:#1877f2;margin:0 0 8px}
.sub{text-align:center;color:#65676b;margin-bottom:24px}
input{width:100%;padding:14px;margin:7px 0;border:1px solid #ddd;border-radius:9px;font-size:16px}
input:focus{outline:2px solid #1877f2;border-color:#1877f2}
.hint{font-size:13px;color:#65676b;margin:4px 2px 10px;line-height:1.5}
button{width:100%;padding:14px;background:#1877f2;color:white;border:0;border-radius:9px;font-size:17px;font-weight:bold;margin-top:12px;cursor:pointer}
a{color:#1877f2;text-decoration:none}
.bottom{text-align:center;margin-top:20px}
.message{background:#e7f3ff;padding:10px;border-radius:8px;margin:8px 0}
.language{text-align:center;margin-bottom:18px;font-size:14px}
</style>
</head>
<body>
<div class="card">
<div class="language">🌐 <a href="{{ url_for('language_settings') }}">{{ t('language') }}</a></div>
<h1>NET BOOK</h1>
<p class="sub">{{ t('register_subtitle') }}</p>

{% with messages = get_flashed_messages() %}
{% for message in messages %}
<div class="message">{{ message }}</div>
{% endfor %}
{% endwith %}

<form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<input name="full_name" placeholder="{{ t('full_name_placeholder') }}" required maxlength="100">

<input name="username" placeholder="{{ t('username_placeholder') }}" required minlength="3" maxlength="30">

<input type="text" name="contact" placeholder="{{ t('contact_placeholder') }}" autocomplete="email" required>
<p class="hint">{{ t('contact_hint') }}</p>

<input type="password" name="password" placeholder="{{ t('password_placeholder') }}" required minlength="10" autocomplete="new-password">

<input type="password" name="confirm_password" placeholder="{{ t('confirm_password_placeholder') }}" required minlength="10" autocomplete="new-password">

<button type="submit">{{ t('register_button') }}</button>
</form>

<div class="bottom">{{ t('already_account') }} <a href="{{ url_for('login') }}">{{ t('login_link') }}</a></div>
</div>
</body>
</html>
